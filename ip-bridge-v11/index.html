<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IP-BRIDGE AI V11</title><style>
:root{font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;color:#18243b;background:#f6f8fd}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{border:0;border-radius:10px;padding:10px 16px;background:#2365ea;color:white;cursor:pointer}button.secondary{background:#eff3fb;color:#334866}input,textarea,select{width:100%;padding:11px;border:1px solid #d6e0ee;border-radius:10px;background:white}textarea{min-height:100px;resize:vertical}.top{display:flex;align-items:center;justify-content:space-between;padding:16px 25px;background:white;border-bottom:1px solid #e5ebf4}.logo{font-size:20px;font-weight:800;color:#225be6}.wrap{max-width:1270px;margin:auto;padding:26px}.muted{color:#667993;font-size:13px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:24px 0}.card,.panel{background:white;border:1px solid #e4eaf3;border-radius:16px;padding:20px;box-shadow:0 3px 14px #2535500b}.metric{font-size:28px;font-weight:800;color:#2563eb}.projects{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:14px}.project{cursor:pointer;text-align:left;background:white;color:#183459;border:1px solid #e4eaf3;padding:22px;border-radius:14px}.project:hover{border-color:#2563eb}.work{display:grid;grid-template-columns:minmax(300px,42%) 1fr;gap:14px;height:calc(100vh - 125px);min-height:600px}.pane{background:white;border:1px solid #e3e9f2;border-radius:14px;display:flex;flex-direction:column;min-height:0}.panehead{padding:16px;border-bottom:1px solid #e8edf5;font-weight:750}.scroll{flex:1;overflow:auto;padding:17px}.compose{padding:15px;border-top:1px solid #e7edf4}.message{max-width:90%;padding:13px;border-radius:13px;background:#eef4ff;margin:9px 0;white-space:pre-wrap;font-size:14px;line-height:1.7}.message.user{background:#2666eb;color:white;margin-left:auto}.tabs{display:flex;gap:5px;flex-wrap:wrap;padding:12px;border-bottom:1px solid #e8edf5}.tabs button{background:#eef3fc;color:#52617d;font-size:12px;padding:8px}.tabs button.active{background:#2563eb;color:white}.doc{white-space:pre-wrap;line-height:1.85;font-size:14px}.doc h3{margin:8px 0}.formgrid{display:grid;gap:12px}.hidden{display:none!important}.badge{display:inline-block;background:#eaf5ed;color:#128151;padding:4px 9px;border-radius:20px;font-size:11px}.actions{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:790px){.work{grid-template-columns:1fr;height:auto}.pane{min-height:430px}.cards{grid-template-columns:1fr}.wrap{padding:12px}}
</style></head><body><header class="top"><div class="logo">▣ IP-BRIDGE <small style="font-size:11px;color:#8d9cba">V11</small></div><span class="muted">발명에서 출원 초안까지 · 독립 MVP</span></header><main class="wrap"><section id="home"><div class="row"><div><h1>내 특허 프로젝트</h1><p class="muted">대화형 발명 구조화 및 특허 문서 작업공간</p></div><button onclick="newProject()">+ 새 프로젝트</button></div><div class="cards"><div class="card">활성 프로젝트<div class="metric" id="count">0</div></div><div class="card">발명 유형<div class="metric">SW · HW</div></div><div class="card">AI 연동<div class="metric" style="font-size:19px">미연결</div><div class="muted">규칙 기반 보조 도구</div></div></div><div class="projects" id="projects"></div></section>
<section id="create" class="hidden"><div class="row"><h2>새 프로젝트</h2><button class="secondary" onclick="show('home')">취소</button></div><div class="panel formgrid" style="max-width:650px"><label>프로젝트 제목<input id="titleInput" placeholder="예: 휴대전화 액정 파손 복구 장치"></label><label>기술 분야<select id="kind"><option>하드웨어</option><option>소프트웨어</option><option>하이브리드</option></select></label><label>발명 아이디어<textarea id="idea" placeholder="어떤 기술적 문제를 어떻게 해결하나요?"></textarea></label><button onclick="saveNew()">프로젝트 만들기 →</button></div></section>
<section id="workspace" class="hidden"><div class="row" style="margin-bottom:12px"><div><button class="secondary" onclick="show('home')">← 프로젝트</button> <b id="projTitle"></b> <span class="badge">초안 작업</span></div><div class="actions"><button class="secondary" onclick="downloadJson()">JSON 내보내기</button><button class="secondary" onclick="downloadTxt()">텍스트 저장</button></div></div><div class="work"><div class="pane"><div class="panehead">✦ AI 발명 인터뷰 <span class="muted">(규칙 기반)</span></div><div class="scroll" id="chat"></div><div class="compose"><textarea id="answer" rows="3" placeholder="현재 질문에 대한 내용을 입력하세요"></textarea><button style="margin-top:8px;width:100%" onclick="submitAnswer()">답변 저장 및 다음 단계 →</button></div></div><div class="pane"><div class="panehead">특허 문서 미리보기 <span class="muted">자동 저장</span></div><div class="tabs" id="tabs"></div><div class="scroll" id="preview"></div></div></div></section></main><script>
const K='ip-bridge-v11-projects';const steps=[['problem','해결하려는 기술적 문제를 구체적으로 설명해 주세요.'],['prior','기존 기술의 한계나 불편한 점은 무엇인가요?'],['solution','핵심 해결수단과 작동 원리를 설명해 주세요.'],['components','필수 구성요소를 이름과 역할별로 알려주세요.'],['effect','기술적 효과와 검증 방법은 무엇인가요?']];const tabNames=['발명 구조','청구항','명세서','초록','도면','자료','품질 검사'];let data=JSON.parse(localStorage.getItem(K)||'[]'),current=null,tab=0;function persist(){localStorage.setItem(K,JSON.stringify(data))}function show(id){for(const p of ['home','create','workspace'])document.getElementById(p).classList.toggle('hidden',p!==id);if(id==='home')renderHome()}function newProject(){document.getElementById('titleInput').value='';document.getElementById('idea').value='';show('create')}function saveNew(){const title=document.getElementById('titleInput').value.trim();if(!title)return alert('제목을 입력해 주세요');const p={id:Date.now().toString(36),title,kind:document.getElementById('kind').value,idea:document.getElementById('idea').value.trim(),answers:{},created:new Date().toISOString()};data.unshift(p);persist();openProject(p.id)}function renderHome(){document.getElementById('count').textContent=data.length;document.getElementById('projects').innerHTML=data.length?data.map(p=>'<button class="project" data-id="'+p.id+'"><div class="badge">'+escapeHtml(p.kind)+'</div><h3>'+escapeHtml(p.title)+'</h3><span class="muted">'+Object.keys(p.answers).length+'/5 단계 입력 · '+p.created.slice(0,10)+'</span></button>').join(''):'<p class="muted">아직 프로젝트가 없습니다. 새 프로젝트를 만들어 시작하세요.</p>';document.querySelectorAll('.project').forEach(b=>b.onclick=()=>openProject(b.dataset.id))}function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function openProject(id){current=data.find(p=>p.id===id);if(!current)return;document.getElementById('projTitle').textContent=current.title;tab=0;show('workspace');render()}function render(){const chat=document.getElementById('chat');chat.innerHTML='<div class="message">기술적 발명의 핵심을 5단계로 정리합니다. 아래 질문에 답하면 오른쪽 문서에 반영됩니다.</div>'+steps.map(([key,q],i)=>'<div class="message">'+(i+1)+'. '+q+'</div>'+(current.answers[key]?'<div class="message user">'+escapeHtml(current.answers[key])+'</div>':'')).join('');let missing=steps.find(([k])=>!current.answers[k]);document.getElementById('answer').placeholder=missing?missing[1]:'보완할 내용을 입력하면 마지막 단계에 추가됩니다';chat.scrollTop=chat.scrollHeight;document.getElementById('tabs').innerHTML=tabNames.map((s,i)=>'<button class="'+(i===tab?'active':'')+'" data-tab="'+i+'">'+s+'</button>').join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=+b.dataset.tab;render()});const a=current.answers,filled=k=>a[k]||'[추가 설명 필요]',title=current.title;const claim='【청구항 1 — 검토용 초안】\n'+title+'에 관한 기술로서, '+filled('components')+'를 포함하고, '+filled('solution')+'에 의해 '+filled('problem')+'의 해결을 지원하는 것을 특징으로 하는 시스템 또는 방법.\n\n※ 구성요소 간 결합·동작 관계, 실시 가능성 및 선행기술 근거를 전문가가 검토해야 합니다.';const texts=['【발명의 명칭】\n'+title+'\n\n【기술 분야】\n'+current.kind+'\n\n【해결 과제】\n'+filled('problem')+'\n\n【종래 기술의 한계】\n'+filled('prior')+'\n\n【해결수단】\n'+filled('solution')+'\n\n【구성요소】\n'+filled('components')+'\n\n【기술적 효과】\n'+filled('effect'),claim,'【발명의 명칭】\n'+title+'\n\n【기술분야】\n'+current.kind+'\n\n【배경기술】\n'+filled('prior')+'\n\n【해결하려는 과제】\n'+filled('problem')+'\n\n【과제의 해결수단】\n'+filled('solution')+'\n\n【발명의 효과】\n'+filled('effect')+'\n\n【청구범위】\n'+claim,'본 발명은 '+current.kind+' 분야의 '+title+'에 관한 것으로, '+filled('solution')+'을 통해 '+filled('problem')+'을 해결하고자 한다.','도면은 아직 첨부되지 않았습니다. 구성요소 및 도면 부호를 검토한 후 추가해야 합니다.','프로젝트 관련 자료 및 선행문헌은 추후 실제 파일 저장소와 연동됩니다.','입력 완료: '+steps.filter(([k])=>a[k]).length+'/5\n\n'+steps.filter(([k])=>!a[k]).map(([k,q])=>'미입력: '+q).join('\n')+'\n\n이 문서는 규칙 기반 기초 초안이며 특허성·권리범위·등록 가능성에 대한 평가가 아닙니다.'];document.getElementById('preview').innerHTML='<div class="doc">'+escapeHtml(texts[tab])+'</div>'}function submitAnswer(){let v=document.getElementById('answer').value.trim();if(!v)return;let step=steps.find(([k])=>!current.answers[k])||steps[4];current.answers[step[0]]=current.answers[step[0]]?current.answers[step[0]]+'\n'+v:v;document.getElementById('answer').value='';persist();render()}function download(name,content,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function downloadJson(){download('ip-bridge-v11-'+current.id+'.json',JSON.stringify(current,null,2),'application/json')}function downloadTxt(){const p=current;download('patent-draft-'+p.id+'.txt',['발명명칭: '+p.title,'기술분야: '+p.kind,'최초 아이디어: '+p.idea,...steps.map(([k,q])=>q+'\n'+(p.answers[k]||''))].join('\n\n'),'text/plain;charset=utf-8')}renderHome();
</script></body></html>
